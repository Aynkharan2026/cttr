<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a0a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CTTR">
<meta name="description" content="Canada Trenton Tamil Radio — கனடா ரெண்ரன் தமிழ் வானொலி">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>CTTR — Canada Trenton Tamil Radio</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: 'Noto Sans Tamil', -apple-system, sans-serif;
    background: #1a0a2e;
    color: #fff;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .app {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    width: 100%;
    position: relative;
    cursor: pointer;
    padding: 20px;
  }

  /* Animated background gradient */
  .bg {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(ellipse at center, #2d1b4e 0%, #1a0a2e 50%, #0d0518 100%);
    z-index: 0;
    transition: background 0.8s ease;
  }

  .bg.playing {
    background: radial-gradient(ellipse at center, #3d2b5e 0%, #1a0a2e 40%, #0d0518 100%);
  }

  /* Radio wave animation rings */
  .waves {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 1;
    pointer-events: none;
  }

  .wave {
    position: absolute;
    border: 2px solid rgba(212, 175, 55, 0.15);
    border-radius: 50%;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    opacity: 0;
  }

  .playing .wave {
    animation: pulse 3s ease-out infinite;
  }

  .wave:nth-child(1) { width: 300px; height: 300px; animation-delay: 0s; }
  .wave:nth-child(2) { width: 400px; height: 400px; animation-delay: 0.5s; }
  .wave:nth-child(3) { width: 500px; height: 500px; animation-delay: 1s; }
  .wave:nth-child(4) { width: 600px; height: 600px; animation-delay: 1.5s; }
  .wave:nth-child(5) { width: 700px; height: 700px; animation-delay: 2s; }

  @keyframes pulse {
    0% { opacity: 0.4; transform: translate(-50%, -50%) scale(0.8); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(1.3); }
  }

  /* Logo */
  .logo-container {
    position: relative;
    z-index: 2;
    width: min(280px, 70vw);
    height: min(280px, 70vw);
    transition: transform 0.3s ease;
  }

  .logo-container:active {
    transform: scale(0.95);
  }

  .logo-container img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    border-radius: 50%;
    filter: drop-shadow(0 0 30px rgba(212, 175, 55, 0.3));
    transition: filter 0.5s ease;
  }

  .playing .logo-container img {
    filter: drop-shadow(0 0 50px rgba(212, 175, 55, 0.6));
  }

  /* Glow ring around logo when playing */
  .glow-ring {
    position: absolute;
    top: -8px; left: -8px; right: -8px; bottom: -8px;
    border-radius: 50%;
    border: 3px solid transparent;
    transition: border-color 0.5s ease;
  }

  .playing .glow-ring {
    border-color: rgba(212, 175, 55, 0.5);
    animation: glow-rotate 4s linear infinite;
  }

  @keyframes glow-rotate {
    0% { box-shadow: 0 0 20px rgba(212, 175, 55, 0.2), inset 0 0 20px rgba(212, 175, 55, 0.1); }
    50% { box-shadow: 0 0 40px rgba(212, 175, 55, 0.4), inset 0 0 30px rgba(212, 175, 55, 0.2); }
    100% { box-shadow: 0 0 20px rgba(212, 175, 55, 0.2), inset 0 0 20px rgba(212, 175, 55, 0.1); }
  }

  /* Status text */
  .status {
    position: relative;
    z-index: 2;
    margin-top: 32px;
    text-align: center;
  }

  .station-name {
    font-size: 18px;
    font-weight: 700;
    color: #d4af37;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .station-name-tamil {
    font-size: 16px;
    color: rgba(212, 175, 55, 0.7);
    margin-bottom: 16px;
  }

  .play-status {
    font-size: 14px;
    color: rgba(255, 255, 255, 0.5);
    transition: color 0.3s ease;
  }

  .playing .play-status {
    color: rgba(255, 255, 255, 0.8);
  }

  .now-playing {
    font-size: 13px;
    color: rgba(255, 255, 255, 0.4);
    margin-top: 12px;
    max-width: 280px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* Equalizer bars */
  .equalizer {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 3px;
    height: 24px;
    margin-top: 16px;
    opacity: 0;
    transition: opacity 0.5s ease;
  }

  .playing .equalizer {
    opacity: 1;
  }

  .eq-bar {
    width: 4px;
    background: #d4af37;
    border-radius: 2px;
    animation: eq 1s ease-in-out infinite;
  }

  .eq-bar:nth-child(1) { height: 8px; animation-delay: 0s; }
  .eq-bar:nth-child(2) { height: 16px; animation-delay: 0.1s; }
  .eq-bar:nth-child(3) { height: 12px; animation-delay: 0.2s; }
  .eq-bar:nth-child(4) { height: 20px; animation-delay: 0.15s; }
  .eq-bar:nth-child(5) { height: 10px; animation-delay: 0.3s; }
  .eq-bar:nth-child(6) { height: 18px; animation-delay: 0.05s; }
  .eq-bar:nth-child(7) { height: 14px; animation-delay: 0.25s; }

  @keyframes eq {
    0%, 100% { transform: scaleY(0.3); }
    50% { transform: scaleY(1); }
  }

  /* Install prompt */
  .install-hint {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    color: rgba(255, 255, 255, 0.25);
    z-index: 3;
    text-align: center;
  }

  /* Loading spinner */
  .loading {
    display: none;
    width: 24px;
    height: 24px;
    border: 2px solid rgba(212, 175, 55, 0.3);
    border-top-color: #d4af37;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-top: 16px;
  }

  .buffering .loading { display: block; }
  .buffering .equalizer { display: none; }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>
</head>
<body>

<div class="bg" id="bg"></div>

<div class="app" id="app" onclick="togglePlay()">
  <div class="waves" id="waves">
    <div class="wave"></div>
    <div class="wave"></div>
    <div class="wave"></div>
    <div class="wave"></div>
    <div class="wave"></div>
  </div>

  <div class="logo-container">
    <div class="glow-ring"></div>
    <img src="logo.jpg" alt="CTTR Logo" draggable="false">
  </div>

  <div class="status">
    <div class="station-name">CTTR</div>
    <div class="station-name-tamil">கனடா ரெண்ரன் தமிழ் வானொலி</div>
    <div class="play-status" id="playStatus">Tap to listen</div>
    <div class="now-playing" id="nowPlaying"></div>
    <div class="equalizer">
      <div class="eq-bar"></div>
      <div class="eq-bar"></div>
      <div class="eq-bar"></div>
      <div class="eq-bar"></div>
      <div class="eq-bar"></div>
      <div class="eq-bar"></div>
      <div class="eq-bar"></div>
    </div>
    <div class="loading" id="loading"></div>
  </div>
</div>

<div class="install-hint" id="installHint">
  Add to Home Screen for the full experience
</div>

<audio id="radio" preload="none">
  <source src="https://ec3.yesstreaming.net:1780/stream" type="audio/mpeg">
</audio>

<script>
  const audio = document.getElementById('radio');
  const app = document.getElementById('app');
  const bg = document.getElementById('bg');
  const playStatus = document.getElementById('playStatus');
  const nowPlaying = document.getElementById('nowPlaying');
  const loading = document.getElementById('loading');
  let isPlaying = false;
  let metadataInterval = null;

  function togglePlay() {
    if (isPlaying) {
      audio.pause();
      audio.src = '';
      isPlaying = false;
      app.classList.remove('playing', 'buffering');
      bg.classList.remove('playing');
      playStatus.textContent = 'Tap to listen';
      nowPlaying.textContent = '';
      if (metadataInterval) clearInterval(metadataInterval);
    } else {
      audio.src = 'https://ec3.yesstreaming.net:1780/stream';
      app.classList.add('buffering');
      playStatus.textContent = 'Connecting...';
      audio.play().then(() => {
        isPlaying = true;
        app.classList.remove('buffering');
        app.classList.add('playing');
        bg.classList.add('playing');
        playStatus.textContent = 'Live';
        fetchMetadata();
        metadataInterval = setInterval(fetchMetadata, 15000);
      }).catch(err => {
        app.classList.remove('buffering');
        playStatus.textContent = 'Tap to listen';
        console.error('Play failed:', err);
      });
    }
  }

  audio.addEventListener('waiting', () => {
    if (isPlaying) {
      app.classList.add('buffering');
      playStatus.textContent = 'Buffering...';
    }
  });

  audio.addEventListener('playing', () => {
    app.classList.remove('buffering');
    if (isPlaying) playStatus.textContent = 'Live';
  });

  audio.addEventListener('error', () => {
    app.classList.remove('playing', 'buffering');
    bg.classList.remove('playing');
    isPlaying = false;
    playStatus.textContent = 'Connection lost — tap to retry';
  });

  async function fetchMetadata() {
    try {
      const resp = await fetch('https://cors1.yesstreaming.net/https://ec3.yesstreaming.net:1780/status-json.xsl');
      const data = await resp.json();
      if (data && data.icestats && data.icestats.source) {
        const source = Array.isArray(data.icestats.source)
          ? data.icestats.source[0]
          : data.icestats.source;
        if (source.title && source.title !== 'Unknown') {
          nowPlaying.textContent = '♪ ' + source.title;
        }
      }
    } catch (e) {
      // Metadata fetch failed silently — stream still plays
    }
  }

  // Media Session API for lock screen controls
  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: 'Canada Trenton Tamil Radio',
      artist: 'CTTR',
      album: 'Live Stream',
      artwork: [
        { src: 'icons/icon-192.png', sizes: '192x192', type: 'image/png' },
        { src: 'icons/icon-512.png', sizes: '512x512', type: 'image/png' }
      ]
    });
    navigator.mediaSession.setActionHandler('play', togglePlay);
    navigator.mediaSession.setActionHandler('pause', togglePlay);
  }

  // Hide install hint after 5 seconds
  setTimeout(() => {
    document.getElementById('installHint').style.opacity = '0';
  }, 5000);

  // Register service worker
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>

</body>
</html>
